general:
  train_mode: true
  task: "instance_segmentation"
  seed: null
  checkpoint: null
  backbone_checkpoint: null
  freeze_backbone: false
  linear_probing_backbone: false
  train_on_segments: false
  eval_on_segments: false
  filter_out_instances: false
  save_visualizations: false
  visualization_point_size: 20
  decoder_id: -1
  export: false
  use_dbscan: false
  ignore_class_threshold: 100
  project_name: fallentree
  experiment_name: fallentree_mask3d
  num_targets: 2  # fallentree + Mask3D no-object class
  add_instance: true
  dbscan_eps: 0.95
  dbscan_min_points: 1
  export_threshold: 0.0001
  reps_per_epoch: 1
  on_crops: false
  scores_threshold: 0.0
  iou_threshold: 1.0
  object_score_threshold: 0.50
  object_iou_threshold: 0.50
  save_las: true
  las_output_dir: ${general.save_dir}/las_predictions
  area: 5
  eval_inner_core: -1
  topk_per_image: 100
  ignore_mask_idx: []
  max_batch_size: 99999999
  save_dir: saved/${general.experiment_name}
  gpus: 1

defaults:
  - data: fallentree
  - data/data_loaders: simple_loader
  - data/datasets: stpls3d_fallentree
  - data/collation_functions: voxelize_collate
  - logging: fallentree
  - model: mask3d
  - metrics: miou
  - optimizer: adamw
  - scheduler: onecyclelr
  - trainer: trainer_fallentree
  - callbacks: callbacks_fallentree
  - matcher: hungarian_matcher
  - loss: set_criterion

hydra:
  run:
    dir: saved/hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: saved/hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.id}
